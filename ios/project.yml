# Horizon for iOS — XcodeGen project (ios/README.md).
#
# Generates Horizon.xcodeproj: `xcodegen generate` (CI does this), then
# `xcodebuild -project Horizon.xcodeproj -scheme Horizon -sdk iphoneos
# -configuration Release CODE_SIGNING_ALLOWED=NO build`.
#
# The Rust engine is a static library, built by the pre-build phase
# (ios/build-rust.sh) and linked with -lhorizon_ios. The app is unsigned by
# design: SideStore/AltStore signs the .ipa on install with a free Apple ID.
name: Horizon
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Horizon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: app
    info:
      path: app/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.ios
        PRODUCT_NAME: Horizon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: app/Horizon-Bridging-Header.h
        # Unsigned by design: no signing identity, no team, no provisioning.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        # The pre-build script runs cargo into ios/target, outside DerivedData:
        # Xcode's user-script sandbox would deny those writes.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/target/aarch64-apple-ios/release
        OTHER_LDFLAGS:
          - $(inherited)
          # The Rust engine (built by the pre-build phase below).
          - -lhorizon_ios
          # zlib, for the resource importer's zip inflate (ZipExtractor.swift).
          - -lz
          # What the engine's dependencies link against: wgpu's Metal backend
          # and cpal's audio backend. The first CI link names any framework
          # still missing here; add it to this list.
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - CoreGraphics
          - -framework
          - IOSurface
          - -framework
          - CoreVideo
          - -framework
          - AudioToolbox
          - -framework
          - AVFoundation
    preBuildScripts:
      - name: Build the Rust engine (horizon-ios staticlib)
        # Always runs: cargo itself is a no-op when nothing changed.
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/build-rust.sh"
schemes:
  Horizon:
    build:
      targets:
        Horizon: all
    run:
      config: Release
    archive:
      config: Release
